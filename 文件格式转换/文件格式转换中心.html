<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件格式转换中心</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <header class="bg-white border-b shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center">
          <i class="fa fa-exchange"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg">文件格式转换中心</h1>
          <p class="text-sm text-slate-500">首页只负责导航，各功能拆分到独立页面</p>
        </div>
      </div>
      <span class="text-sm text-slate-500">Multi-page UI</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-bold mb-3">选择一个功能进入</h2>
      <p class="text-slate-500">拆分页面后更清晰，操作更简单，后续维护也更方便</p>
    </div>

    <div class="grid md:grid-cols-2 xl:grid-cols-4 gap-6">
      <a href="image.html" class="bg-white rounded-2xl p-6 shadow-sm hover:shadow-lg transition border border-slate-100">
        <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center mb-4">
          <i class="fa fa-file-image-o text-xl"></i>
        </div>
        <h3 class="text-lg font-semibold mb-2">图片转换</h3>
        <p class="text-sm text-slate-500">JPG / PNG / WebP 互转，支持拖拽、批量、进度条</p>
      </a>

      <a href="document.html" class="bg-white rounded-2xl p-6 shadow-sm hover:shadow-lg transition border border-slate-100">
        <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-4">
          <i class="fa fa-file-text-o text-xl"></i>
        </div>
        <h3 class="text-lg font-semibold mb-2">文档转换</h3>
        <p class="text-sm text-slate-500">TXT / MD / CSV 本地处理，Office / PDF 预留后端</p>
      </a>

      <a href="av.html" class="bg-white rounded-2xl p-6 shadow-sm hover:shadow-lg transition border border-slate-100">
        <div class="w-12 h-12 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center mb-4">
          <i class="fa fa-file-audio-o text-xl"></i>
        </div>
        <h3 class="text-lg font-semibold mb-2">音视频转换</h3>
        <p class="text-sm text-slate-500">MP3 / MP4 互转预留入口，适合后端接 FFmpeg</p>
      </a>

      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <div class="w-12 h-12 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center mb-4">
          <i class="fa fa-info-circle text-xl"></i>
        </div>
        <h3 class="text-lg font-semibold mb-2">说明</h3>
        <p class="text-sm text-slate-500">
          图片和文本类可前端直接完成；PDF、Word、Excel、PPT、音视频类建议接后端。
        </p>
      </div>
    </div>
  </main>
</body>
</html>
